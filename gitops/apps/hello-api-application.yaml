apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DiabiWali/m2cloud-k8s-dotnetgigs.git
    targetRevision: main
    path: apps/hello-api/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: m2cloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
