apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hello-api-allow-ingress
  labels:
    app.kubernetes.io/name: hello-api
    app.kubernetes.io/part-of: m2cloud-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hello-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}

    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}

    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: curl-hello-api-test
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
