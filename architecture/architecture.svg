<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="1400" height="850" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">M2Cloud Kubernetes Architecture</text>
  <text x="60" y="105" font-family="Arial" font-size="17" fill="#475569">Ingress HTTPS · Microservices internes · NetworkPolicy · HPA · Prometheus/Grafana · EFK</text>

  <rect x="45" y="140" width="1310" height="610" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="180" font-family="Arial" font-size="20" font-weight="700" fill="#1e293b">Cluster Kubernetes namespace: m2cloud</text>

  <rect x="80" y="220" width="220" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="116" y="258" font-family="Arial" font-size="18" font-weight="700" fill="#075985">Ingress NGINX</text>
  <text x="126" y="285" font-family="Arial" font-size="14" fill="#075985">TLS 443 / HTTPS</text>

  <rect x="365" y="220" width="210" height="90" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="432" y="258" font-family="Arial" font-size="18" font-weight="700" fill="#166534">webmvc</text>
  <text x="412" y="285" font-family="Arial" font-size="14" fill="#166534">HPA + probes</text>

  <rect x="675" y="170" width="220" height="80" rx="14" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="720" y="204" font-family="Arial" font-size="17" font-weight="700" fill="#854d0e">applicants-api</text>
