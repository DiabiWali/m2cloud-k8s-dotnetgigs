  <text x="1070" y="368" font-family="Arial" font-size="18" font-weight="700" fill="#86198f">rabbitmq</text>
  <text x="1055" y="395" font-family="Arial" font-size="14" fill="#86198f">messaging interne</text>

  <rect x="1010" y="450" width="210" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1070" y="488" font-family="Arial" font-size="18" font-weight="700" fill="#5b21b6">user-data</text>
  <text x="1082" y="515" font-family="Arial" font-size="14" fill="#5b21b6">Redis</text>

  <rect x="80" y="610" width="520" height="100" rx="18" fill="#f1f5f9" stroke="#64748b"/>
