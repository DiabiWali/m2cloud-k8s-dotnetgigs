apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: {{ include "dotnetgigs.namespace" . }}
  labels:
    {{- include "dotnetgigs.labels" . | nindent 4 }}
    app.kubernetes.io/name: identity-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.identityApi }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-api
  template:
    metadata:
      labels:
        {{- include "dotnetgigs.labels" . | nindent 8 }}
        app.kubernetes.io/name: identity-api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: user-data
                topologyKey: kubernetes.io/hostname
      containers:
        - name: identity-api
          image: {{ include "dotnetgigs.image" (list . .Values.images.identityApi) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: dotnetgigs-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: HostRabbitmq
              valueFrom:
                configMapKeyRef:
                  name: dotnetgigs-config
                  key: HostRabbitmq
            - name: RedisHost
              valueFrom:
                configMapKeyRef:
                  name: dotnetgigs-config
                  key: RedisHost
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.identityApi | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: {{ include "dotnetgigs.namespace" . }}
  labels:
    {{- include "dotnetgigs.labels" . | nindent 4 }}
    app.kubernetes.io/name: identity-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-api
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: {{ .Values.service.api.targetPort }}
