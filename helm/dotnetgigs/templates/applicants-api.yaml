apiVersion: apps/v1
kind: Deployment
metadata:
  name: applicants-api
  namespace: {{ include "dotnetgigs.namespace" . }}
  labels:
    {{- include "dotnetgigs.labels" . | nindent 4 }}
    app.kubernetes.io/name: applicants-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.applicantsApi }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: applicants-api
  template:
    metadata:
      labels:
        {{- include "dotnetgigs.labels" . | nindent 8 }}
        app.kubernetes.io/name: applicants-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: applicants-api-sa
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sql-data
                topologyKey: kubernetes.io/hostname
      containers:
        - name: applicants-api
          image: {{ include "dotnetgigs.image" (list . .Values.images.applicantsApi) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: dotnetgigs-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: HostRabbitmq
              valueFrom:
                configMapKeyRef:
                  name: dotnetgigs-config
                  key: HostRabbitmq
            - name: ConnectionString
              valueFrom:
                secretKeyRef:
                  name: dotnetgigs-secrets
                  key: ApplicantsConnectionString
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.applicantsApi | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: applicants-api
  namespace: {{ include "dotnetgigs.namespace" . }}
  labels:
    {{- include "dotnetgigs.labels" . | nindent 4 }}
    app.kubernetes.io/name: applicants-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: applicants-api
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: {{ .Values.service.api.targetPort }}
