{{- if .Values.backup.sql.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sql-data-backup
  namespace: {{ include "dotnetgigs.namespace" . }}
  labels:
    {{- include "dotnetgigs.labels" . | nindent 4 }}
    app.kubernetes.io/name: sql-data-backup
    app.kubernetes.io/component: database-backup
spec:
  schedule: {{ .Values.backup.sql.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.sql.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.sql.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "dotnetgigs.labels" . | nindent 12 }}
            app.kubernetes.io/name: sql-data-backup
            app.kubernetes.io/component: database-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: sql-backup
              image: {{ include "dotnetgigs.image" (list . .Values.images.sqlData) }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              env:
                - name: SA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dotnetgigs-secrets
                      key: MSSQL_SA_PASSWORD
                - name: BACKUP_DIR
                  value: {{ .Values.backup.sql.targetDirectory | quote }}
              command:
                - /bin/bash
                - -lc
              args:
                - |
                  set -euo pipefail

                  if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
                    SQLCMD="/opt/mssql-tools18/bin/sqlcmd"
                    SQLCMD_FLAGS="-C"
                  elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then
                    SQLCMD="/opt/mssql-tools/bin/sqlcmd"
                    SQLCMD_FLAGS=""
                  else
                    echo "sqlcmd introuvable dans l'image SQL."
                    exit 1
                  fi

                  TS="$(date +%Y%m%d-%H%M%S)"

                  echo "[backup] Waiting for SQL Server..."
                  for i in {1..60}; do
                    if ${SQLCMD} ${SQLCMD_FLAGS} -S sql-data -U sa -P "${SA_PASSWORD}" -b -Q "SELECT 1" >/dev/null 2>&1; then
                      echo "[backup] SQL Server is ready."
                      break
                    fi

                    if [ "$i" -eq 60 ]; then
                      echo "[backup] SQL Server not ready after timeout."
                      exit 1
                    fi

                    sleep 5
                  done

                  backup_db() {
                    DB_NAME="$1"
                    BACKUP_FILE="$2"

                    echo "[backup] Backing up database ${DB_NAME} to ${BACKUP_FILE}"

                    ${SQLCMD} ${SQLCMD_FLAGS} \
                      -S sql-data \
                      -U sa \
                      -P "${SA_PASSWORD}" \
                      -b \
                      -Q "BACKUP DATABASE [${DB_NAME}] TO DISK = N'${BACKUP_FILE}' WITH INIT, COMPRESSION, CHECKSUM, STATS = 10"

                    echo "[backup] Backup completed for ${DB_NAME}"
                  }

{{- range .Values.backup.sql.databases }}
                  backup_db {{ .name | quote }} "${BACKUP_DIR}/{{ .filePrefix }}-${TS}.bak"
{{- end }}

                  echo "[backup] SQL backup job completed successfully."
              resources:
                {{- toYaml .Values.resources.sqlBackup | nindent 16 }}
{{- end }}
