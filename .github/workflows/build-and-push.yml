name: build-and-push

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: m2cloud-webmvc
            dockerfile: dockerfiles/Web.Dockerfile
          - image: m2cloud-applicants-api
            dockerfile: dockerfiles/Applicants.Api.Dockerfile
          - image: m2cloud-jobs-api
            dockerfile: dockerfiles/Jobs.Api.Dockerfile
          - image: m2cloud-identity-api
            dockerfile: dockerfiles/Identity.Api.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap upstream source
        run: ./scripts/bootstrap-from-upstream.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./appscore
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
