name: CI - hello-api

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        working-directory: apps/hello-api
        run: docker build -t hello-api:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hello-api:ci
          format: table
          exit-code: "0"

      - name: Helm lint
        run: helm lint apps/hello-api/helm
