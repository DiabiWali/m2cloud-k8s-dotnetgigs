apiVersion: apps/v1
kind: Deployment
metadata:
  name: webmvc-canary
  labels:
    app.kubernetes.io/name: webmvc
    app.kubernetes.io/component: frontend
    canary: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webmvc
      canary: "true"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webmvc
        app.kubernetes.io/component: frontend
        canary: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: webmvc
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
