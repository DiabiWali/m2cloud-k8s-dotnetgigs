apiVersion: v1
kind: ServiceAccount
metadata:
  name: applicants-api-sa
  namespace: m2cloud
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: applicants-api-read-config
  namespace: m2cloud
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: applicants-api-read-config
  namespace: m2cloud
subjects:
  - kind: ServiceAccount
    name: applicants-api-sa
    namespace: m2cloud
roleRef:
  kind: Role
  name: applicants-api-read-config
  apiGroup: rbac.authorization.k8s.io
