apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.component_id }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DiabiWali/m2cloud-k8s-dotnetgigs.git
    targetRevision: main
    path: apps/${{ values.component_id }}/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
