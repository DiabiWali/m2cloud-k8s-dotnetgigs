replicaCount: ${{ values.replicas }}

image:
  repository: ghcr.io/diabiwali/${{ values.component_id }}
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: ${{ values.port }}

ingress:
  enabled: true
  className: nginx
  host: ${{ values.host }}
  tlsSecretName: dotnetgigs-tls

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  namespace: observability
